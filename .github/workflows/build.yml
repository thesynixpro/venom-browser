
name: Build and Release ApraxBrowser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: main
          name: ApraxBrowser v1.0.${{ github.run_number }}
          body: |
            Automatically built from the latest main branch.
            Download the APK below to install ApraxBrowser.
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
